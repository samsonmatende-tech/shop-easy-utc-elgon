<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { --bg:#f3f5f9; --card:#fff; --ink:#1b2430; --muted:#6a7585; --line:#d9dfe8; --accent:#2457d6; --err:#c0392b; --ok:#1e8e5a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212b; --ink:#eef1f6; --muted:#9aa5b5; --line:#2e3644; --accent:#6b93f5; --err:#ff7b6b; --ok:#4cc38a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
         font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:.9rem; margin:14px 0 4px; }
  input { width:100%; padding:11px 12px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; }
  input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:18px; padding:12px; font:inherit; font-weight:600; border:0; border-radius:8px; cursor:pointer; background:var(--accent); color:#fff; }
  button.alt { background:#1877f2; margin-top:10px; }
  button.link { background:none; color:var(--accent); margin-top:14px; font-weight:500; }
  button:disabled { opacity:.6; cursor:wait; }
  .or { text-align:center; color:var(--muted); font-size:.85rem; margin:16px 0 0; }
  #msg { min-height:1.4em; margin-top:14px; font-size:.9rem; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="card">

  <!-- Logged-out view -->
  <section id="authView">
    <h1 id="title">Log in</h1>
    <p class="sub" id="sub">Welcome back.</p>
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <button id="submitBtn">Log in</button>
      <button class="link" id="toggleBtn">Need an account? Sign up</button>
      <button class="link" id="resetBtn" style="margin-top:0">Forgot password?</button>
      <p class="or">or</p>
      <button class="alt" id="fbBtn">Continue with Facebook</button>
    </div>
  </section>

  <!-- Logged-in view -->
  <section id="userView" hidden>
    <h1>Waiting for approval</h1>
    <p class="sub" id="who"></p>
    <p class="sub">The site admin needs to approve your account. Check back later.</p>
    <button id="logoutBtn">Log out</button>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // 1. Paste your values from Supabase → Project Settings → API
  const SUPABASE_URL = 'YOUR_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_ANON_PUBLIC_KEY';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  let mode = 'login'; // or 'signup'

  function say(text, type) { const m = $('msg'); m.textContent = text || ''; m.className = type || ''; }

  function setMode(m) {
    mode = m;
    const signup = m === 'signup';
    $('title').textContent = signup ? 'Create account' : 'Log in';
    $('sub').textContent = signup ? 'It only takes a minute.' : 'Welcome back.';
    $('submitBtn').textContent = signup ? 'Sign up' : 'Log in';
    $('toggleBtn').textContent = signup ? 'Have an account? Log in' : 'Need an account? Sign up';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    say('');
  }

  async function showUser(session) {
    $('authView').hidden = !!session;
    $('userView').hidden = !session;
    if (!session) return;
    $('who').textContent = session.user.email || '';
    const { data } = await sb.from('profiles').select('approved').eq('id', session.user.id).maybeSingle();
    if (data && data.approved) location.href = 'site.html';
  }

  async function run(btn, fn) {
    btn.disabled = true; say('');
    try { await fn(); } catch (e) { say(e.message || 'Something went wrong.', 'err'); }
    btn.disabled = false;
  }

  $('toggleBtn').onclick = () => setMode(mode === 'login' ? 'signup' : 'login');

  $('submitBtn').onclick = () => run($('submitBtn'), async () => {
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || password.length < 6) throw new Error('Enter an email and a password of 6+ characters.');
    if (mode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href } });
      if (error) throw error;
      if (!data.session) say('Check your email to confirm your account, then log in.', 'ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  });

  $('resetBtn').onclick = () => run($('resetBtn'), async () => {
    const email = $('email').value.trim();
    if (!email) throw new Error('Enter your email first.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    if (error) throw error;
    say('Password reset link sent. Check your email.', 'ok');
  });

  $('fbBtn').onclick = () => run($('fbBtn'), async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'facebook', options: { redirectTo: location.href } });
    if (error) throw error;
  });

  $('logoutBtn').onclick = () => run($('logoutBtn'), async () => {
    const { error } = await sb.auth.signOut();
    if (error) throw error;
  });

  // Keep the page in sync with login state (also runs after Facebook/email-link redirects)
  sb.auth.getSession().then(({ data }) => showUser(data.session));
  sb.auth.onAuthStateChange((_e, session) => setTimeout(() => showUser(session), 0));
</script>
</body>
</html>
